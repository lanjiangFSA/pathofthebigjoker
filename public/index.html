<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大怪路子</title><link rel="stylesheet" href="style.css"><body><main><section id="lobby" class="panel"><p class="tag">上海扑克 · 6 人对抗</p><h1>大怪路子</h1><p>三副牌 · 两队交叉落座 · 升级玩法</p><input id="name" maxlength="12" placeholder="你的昵称" value="牌友"><button id="create">创建牌桌</button><div class="join"><input id="code" maxlength="6" placeholder="输入 6 位房间号"><button id="join">加入</button></div><small>创建后将房间号发给 5 位朋友</small><p id="error"></p></section><section id="table" hidden><header><div><span class="tag">房间</span><b id="room"></b><button id="copy">复制号码</button></div><div>将牌 <b id="trump">2</b>　<span id="status"></span></div></header><div class="seats" id="seats"></div><div class="board"><div id="message"></div><div id="played"></div><div id="turn"></div><div id="startbox"><button id="start">开始发牌</button><p>需 6 人全部入座</p></div></div><div class="actions"><button id="pass">不要</button><button id="play">出牌</button></div><div id="hand"></div><footer>规则：单张、对子、三张、五路（顺子／同花／葫芦／四带一／同花顺／五根）</footer></section></main><script src="game.js"></script></body></html>
