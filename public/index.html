<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>大怪路子</title>
<link rel="stylesheet" href="style.css">
<body>
<main>
  <section id="lobby" class="panel">
    <p class="tag">上海扑克 · 6 人对抗</p>
    <h1>大怪路子</h1>
    <p>三副牌 · 两队交叉落座 · 六副一赛段</p>
    <input id="name" maxlength="12" placeholder="你的昵称" value="牌友">
    <button id="create">创建牌桌</button>
    <div class="join">
      <input id="code" maxlength="6" placeholder="输入 6 位房间号">
      <button id="join">加入</button>
    </div>
    <small>创建后将房间号发给朋友；空位会由 AI 补齐。刷新可自动回到原房间。建议横屏游玩。</small>
    <p id="error"></p>
  </section>
  <section id="table" hidden>
    <header class="topbar">
      <div class="top-left">
        <span class="tag">房间</span><b id="room"></b>
        <button type="button" id="copy">复制</button>
        <button type="button" id="leave">退出</button>
        <div class="audio-menu">
          <button type="button" id="audioMenuBtn" aria-expanded="false" aria-haspopup="true" aria-controls="audioMenu">声音 ▾</button>
          <div id="audioMenu" class="audio-menu-panel" hidden>
            <label class="vol-row">音乐
              <input type="range" id="volMusic" min="0" max="100" value="30" step="1">
              <span id="volMusicVal">30</span>
            </label>
            <label class="vol-row">音效
              <input type="range" id="volSfx" min="0" max="100" value="100" step="1">
              <span id="volSfxVal">100</span>
            </label>
          </div>
        </div>
      </div>
      <div class="top-mid">
        <span id="status"></span>
      </div>
      <div class="top-scores">
        <span class="redscore" id="redScoreWrap">红 <b id="redScore">0</b></span>
        <span class="sep">:</span>
        <span class="bluescore" id="blueScoreWrap">蓝 <b id="blueScore">0</b></span>
      </div>
    </header>
    <div id="table-arena" class="table-arena">
      <div class="felt"></div>
      <div class="seat-slot" data-slot="topL"></div>
      <div class="seat-slot" data-slot="topR"></div>
      <div class="seat-slot" data-slot="leftU"></div>
      <div class="seat-slot" data-slot="leftL"></div>
      <div class="seat-slot" data-slot="rightU"></div>
      <div class="seat-slot" data-slot="rightL"></div>
      <div class="seat-slot" data-slot="bottom"></div>
      <div class="arena-center">
        <div id="message"></div>
        <div id="playedBy"></div>
        <div id="played"></div>
        <div id="trickLog" class="trick-log"></div>
      </div>
      <div id="startbox" class="docked">
        <button id="start">开始发牌</button>
        <p>座位见牌桌；不足 6 人时开始后 AI 补齐</p>
      </div>
    </div>
    <div id="dock">
      <div class="actions">
        <div id="self-timer" class="self-timer" hidden><div class="clock-face">0</div></div>
        <button id="pass">不要</button>
        <button id="play">出牌</button>
      </div>
      <div id="hand" class="hand-cols"></div>
    </div>
    <footer>规则：单张、对子、三张、五路。手牌按点数竖列；点选单张，拖选多张，双击整列。六副一赛段后重新分组。</footer>
  </section>
</main>
<script src="hand-select.js"></script>
<script src="audio-diff.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
